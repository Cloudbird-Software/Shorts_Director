    zh: 广告法极限词
    def: 最/第一/国家级等绝对化用语
    equivalence_class: [AD_LAW]
    deprecated: false
    replaced_by: null
  - id: AD_LAW_UNPROVEN_CLAIM
    zh: 无依据功效宣称
    def: 未经证实的功效/效果宣称
    equivalence_class: [AD_LAW]
    deprecated: false
    replaced_by: null
  - id: MEDICAL_CLAIM
    zh: 医疗功效表述
    def: 涉及治疗/预防疾病表述（食品高危）
    equivalence_class: [AD_LAW, CATEGORY]
    deprecated: false
    replaced_by: null
  - id: FINANCIAL_PROMISE
    zh: 收益承诺
    def: 投资回报类承诺表述
    equivalence_class: [AD_LAW, CATEGORY]
    deprecated: false
    replaced_by: null
  - id: PRICE_FRAUD
    zh: 价格误导
    def: 虚构原价/不实折扣
    equivalence_class: [AD_LAW]
    deprecated: false
    replaced_by: null
