# compliance_risk —— 合规风险类型词表（15–20 值）
# ComplianceProfile 的禁配规则与 ComplianceGate 各 Gate 的产出分类共用；
# L3 阈值策略与 L0/L1/L2 相反：宁可错杀（Engineering_plan §5.7）。
version: 1
name: compliance_risk
kind: enum
values:
