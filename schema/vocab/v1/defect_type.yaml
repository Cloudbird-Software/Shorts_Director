# defect_type —— 缺陷类型词表（QC 断言与返修单共用；25–35 值建议）
# 命名空间按 QC 层级分组：L0 确定性技术 / L1 内容一致性 / L2 生成物 / L3 合规。
# defect -> probable_cause -> layman_action 映射表（返修指令资产）以本表 id 为外键。
version: 1
name: defect_type
kind: enum
