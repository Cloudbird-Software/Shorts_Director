  - id: CRAFT_STORY
    zh: 工艺故事
    def: 独家手艺/制作工艺叙事
    equivalence_class: [TRUST]
    deprecated: false
    replaced_by: null
  - id: PERSONA_STORY
    zh: 人格故事
    def: 店主/店员的人格化叙事
    equivalence_class: [TRUST]
    deprecated: false
    replaced_by: null
  - id: TESTIMONY_QUOTE
    zh: 证言引用
    def: 引用顾客原话评价
    equivalence_class: [TRUST]
    deprecated: false
    replaced_by: null
  - id: DATA_CITE
    zh: 数据引用
    def: 引用可核验的经营数据
