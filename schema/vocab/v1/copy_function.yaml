# copy_function —— 文案功能词表（15–25 值）
# 是 caption_blocks[].copy_function 与文案生成 BAML 的输出约束；
# 等价类与 beat_role 对齐，用于多样性判重（copy_ngrams 按功能分组统计）。
version: 1
name: copy_function
kind: enum
values:
  - id: QUESTION_HOOK
    zh: 提问钩
    def: 以疑问句开头制造信息差
    equivalence_class: [HOOK]
    deprecated: false
    replaced_by: null
  - id: NUMBER_HOOK
    zh: 数字钩
    def: 以具体数字开场（年限/销量/价格）
    equivalence_class: [HOOK]
    deprecated: false
    replaced_by: null
  - id: COUNTERINTUITIVE_HOOK
    zh: 反常识钩
    def: 挑战常识认知引发好奇
    equivalence_class: [HOOK]
    deprecated: false
    replaced_by: null
  - id: SCENE_HOOK
    zh: 场景带入钩
    def: 描绘时间地点场景让目标客代入
    equivalence_class: [HOOK]
    deprecated: false
    replaced_by: null
  - id: RESULT_FIRST
    zh: 结果前置
    def: 先给成品/结果再讲过程
    equivalence_class: [HOOK, DESIRE]
    deprecated: false
    replaced_by: null
  - id: PAIN_CALLOUT
    zh: 痛点点名
    def: 点名目标客群的具体困扰
    equivalence_class: [CONTEXT]
    deprecated: false
    replaced_by: null
