name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1
    with:
      runtime: node
      node-version: "24"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1

  contract:
    # 契约兼容性检测门（P2-4，ADR-0038）：OpenAPI/JSON Schema breaking + DB migration
    # destructive DDL 分类；policy = .github governance/policy/contracts.yaml（org 合入前
    # 用引擎内置 bootstrap 快照）。无事件条件：PR/push 两面都真跑，无 EXPECTED_SKIP 登记。
    # BOOTSTRAP 钉扎：uses 与 ciw-ref 均指向 CI-Workflows PR #18 分支提交（两处一致，
    # 被调用侧无法自取自身 ref）；其 squash 合入并走 v1.X.Y 发布四步流程后，两处同改
    # merge SHA（勿用可变 @main）。
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/contract.yml@322a1fade276396ea0016e4649829a92cde5e572 # v1
    with:
      ciw-ref: 322a1fade276396ea0016e4649829a92cde5e572

  gate:
    if: always()
    needs: [hygiene, check, deps, contract]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS (event=$EVENT)"
          # 严格断言（P1-3 .github#84 / ADR-0032，standards/automation/required-check-chains.md）：
          # skipped≠success——仅下列 EXPECTED_SKIP 登记的事件互补 job 允许 skipped，
          # 未登记的 skipped 与一切非 success（failure/cancelled/timed_out/startup_failure）一律红
          case "$EVENT" in
            pull_request) EXPECTED_SKIP="" ;;
            push)         EXPECTED_SKIP="deps" ;;
            *)            EXPECTED_SKIP="" ;;
          esac
          BAD=$(echo "$NEEDS" | jq -r --arg skip "$EXPECTED_SKIP" '
            to_entries[]
            | . as $e
            | select(.value.result != "success")
            | select((($skip | split(" ")) | index($e.key)) == null)
            | "\($e.key)=\($e.value.result)"')
          if [[ -n "$BAD" ]]; then
            echo "::error::以下 job 非 success 且不属于事件 $EVENT 的结构性预期跳过：$BAD（skipped≠success——ADR-0032）"; exit 1
          fi
